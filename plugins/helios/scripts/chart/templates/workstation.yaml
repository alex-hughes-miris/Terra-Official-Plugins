apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: "{{ .Values.name }}"
  annotations:
    # comma separated list of users that can access this workstation as read only.
    juno-innovations.com/shared: "none"
    juno-innovations.com/kuiper-state: "{{ .Values._kuiper }}"
  labels:
    juno-innovations.com/app: "polaris"
    juno-innovations.com/workstation: "{{ .Values.name }}"
    juno-innovations.com/user: "{{ .Values.user }}"
    juno-innovations.com/session: "{{ .Values.session }}"


spec:
  replicas: 1

  selector:
    matchLabels:
      juno-innovations.com/workstation: "{{ .Values.name }}"

  template:
    metadata:
      labels:
        juno-innovations.com/app: polaris
        juno-innovations.com/user: "{{ .Values.user }}"
        juno-innovations.com/workstation: "{{ .Values.name }}"
      annotations:
        # This will block the cluster autoscaler from evicting this pod in the case
        # it can move to a cheaper instance. This does come at a cost, but ideally
        # this should stop from a workstation getting ripped out from under existing users.
        cluster-autoscaler.kubernetes.io/safe-to-evict: "false"

    spec:
      automountServiceAccountToken: false
      hostname: "{{ .Values.name }}"

      # workstation nodes will require juno-innovations.com/workstation: "true"
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: juno-innovations.com/workstation
                    operator: In
                    values:
                      - "true"
                  {{- if .Values.selector }}
                  {{- range .Values.selector }}
                  - key: {{ .key | quote }}
                    operator: In
                    values:
                      - {{ .value | quote }}
                  {{- end }}
                  {{- end }}

      # allow for this pod to work on nodes reserved for workstations
      tolerations:
        - key: "juno-innovations.com/workstation"
          operator: "Exists"
          effect: "NoSchedule"

      {{- if .Values.gpu }}
      runtimeClassName: nvidia
      {{- end }}

      {{- if .Values.pullSecret }}
      imagePullSecrets:
        - name: "{{ .Values.pullSecret }}"
      {{- end }}

      containers:
        - name: helios
          imagePullPolicy: IfNotPresent
          image: "{{ .Values.registry }}/{{ .Values.repo }}:{{ .Values.tag }}"
          resources:
            requests:
              memory: "{{ .Values.memory }}"
              cpu: "{{ .Values.cpu }}"
            # gotmpl's or is a function taking 2 args - this is "X or Y or Z" translated to python
            {{- if or (or .Values.gpu .Values.memoryLimit) .Values.cpuLimit }}
            limits:
            {{- if .Values.gpu }}
              nvidia.com/gpu: "1"
            {{- end }}
            {{- if .Values.cpuLimit }}
              cpu: "{{ .Values.cpuLimit }}"
            {{- end }}
            {{- if .Values.memoryLimit }}
              memory: "{{ .Values.memoryLimit }}"
            {{- end }}
            {{- end }}
          startupProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 2 # helios boots very fast
            failureThreshold: 60  # start up totals 2 * 60 = 2 mins
            periodSeconds: 2
          livenessProbe:
            tcpSocket:
              port: 3000
            failureThreshold: 24
            periodSeconds: 5
          ports:
            - containerPort: 3000
              name: viewer
          env:
            - name: JUNO_WORKSTATION
              value: "{{ .Values.name }}"
            - name: JUNO_PROJECT
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: USER
              value: "{{ .Values.user }}"
            - name: HOME
              value: "/home/{{ .Values.user }}"
            - name: UID
              value: "{{ .Values.puid }}"
            - name: GID
              value: "{{ .Values.guid }}"
            - name: PREFIX
              value: "/polaris/{{ .Values.name }}/"
            {{- if .Values.dind.enabled }}
            - name: DOCKER_HOST
              value: "unix:///var/run/dind/docker.sock"
            - name: DOCKER_BUILDKIT
              value: "1"
            {{- end }}
            {{- range .Values.env }}
            - name: {{ .name | quote }}
              value: {{ .value | quote }}
            {{- end }}
          volumeMounts:
            - mountPath: /dev/shm
              name: shm
            {{- if .Values.volumeMounts }}
            {{- toYaml .Values.volumeMounts | nindent 12 }}
            {{- end }}
            {{- if .Values.plugins }}
            {{- range .Values.plugins }}
            - name: {{ .name | quote }}
              subPath: {{ .file | quote }}
              mountPath: "/etc/helios/init.d/{{ .name }}/{{ .file }}"
            {{- end }}
            {{- end }}
            {{- if .Values.dind.enabled }}
            - name: docker-run
              mountPath: /var/run/dind
            {{- end }}
        {{- if .Values.dind.enabled }}
        - name: dind
          image: "{{ .Values.dind.image }}"
          {{- if eq .Values.dind.mode "privileged" }}
          securityContext:
            privileged: true
          {{- else }}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
          {{- end }}
          env:
            - name: DOCKER_TLS_CERTDIR
              value: ""
            {{- if eq .Values.dind.mode "rootless" }}
            # rootless dockerd reads DOCKER_HOST for its own socket path
            - name: DOCKER_HOST
              value: "unix:///var/run/dind/docker.sock"
            {{- end }}
          args:
            - "--host=unix:///var/run/dind/docker.sock"
            - "--data-root=/var/lib/docker"
            - "--log-driver=json-file"
            - "--log-opt=max-size=10m"
            - "--log-opt=max-file=3"
            {{- range .Values.dind.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.dind.resources | nindent 12 }}
          readinessProbe:
            exec:
              command: ["/bin/sh","-lc","[ -S /var/run/dind/docker.sock ]"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -lc
                - >
                  echo -e "GET /_ping HTTP/1.0\r\n\r\n" |
                  socat - UNIX-CONNECT:/var/run/dind/docker.sock | grep -q OK
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: docker-run
              mountPath: /var/run/dind
            - name: docker-graph
              mountPath: /var/lib/docker
        {{- if .Values.dind.relaxSocketPerms }}
        - name: dind-sock-perms
          image: alpine:3.20
          command: ["/bin/sh","-lc"]
          args:
            - |
              while true; do
                if [ -S /var/run/dind/docker.sock ]; then chmod 666 /var/run/dind/docker.sock; fi
                sleep 2
              done
          volumeMounts:
            - name: docker-run
              mountPath: /var/run/dind
          resources:
            requests: { cpu: "5m", memory: "16Mi" }
        {{- end }}
        {{- end }}
      volumes:
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi
        {{- if .Values.volumeMounts }}
        {{- toYaml .Values.volumes | nindent 8 }}
        {{- end }}
        {{- if .Values.plugins }}
        {{- range .Values.plugins }}
        - name: {{ .name | quote }}
          configMap:
            name: {{ .config | quote }}
            defaultMode: 0777
        {{- end }}
        {{- end }}
        {{- if .Values.dind.enabled }}
        - name: docker-run
          emptyDir: {}
        - name: docker-graph
          {{- if eq .Values.dind.data.type "pvc" }}
          persistentVolumeClaim:
            claimName: {{ required "dind.data.pvc must be set when dind.data.type=pvc" .Values.dind.data.pvc | quote }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- end }}
